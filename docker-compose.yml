# ═══════════════════════════════════════════════════════════════════════════════
# Files Hub — Unified Docker Compose
# Works for both Directory and Storage nodes. Set NODE_MODE in .env.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bake Hassan's URL into the frontend so fresh sessions can find the fallback
        VITE_FALLBACK_NODE_URLS: "https://alphaservers.dns.army"
    env_file: .env
    environment:
      # Pass NODE_MODE explicitly if you want to override the .env file
      - NODE_MODE=${NODE_MODE:-directory}
    volumes:
      - ./data:/data
      - /etc/letsencrypt:/certs:ro
      # ── Drive mounts ────────────────────────────────────────────────────
      # Add your actual paths here. Examples:
      - /mnt/WD2T/Studies:/mnt/WD2T/Studies:ro
      - /mnt/WD2T/Movies:/mnt/WD2T/Movies:ro
      #   - /home/user/shared:/mnt/shared:ro
      #   - C:/Users/friend/Files:/mnt/share1:ro   # Windows
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    # Optional standalone frontend serving (e.g. via nginx)
    profiles: ["frontend"]
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
