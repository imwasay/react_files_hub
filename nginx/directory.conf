server {
    listen 80;
    server_name ntrides.com.au;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ntrides.com.au;

    ssl_certificate     /etc/letsencrypt/live/ntrides.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntrides.com.au/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;

    # API → FastAPI backend
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # streaming support
        proxy_buffering    off;
        proxy_http_version 1.1;
    }

    # React SPA — serve static, fallback to index.html
    location / {
        root  /var/www/ntrides;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
