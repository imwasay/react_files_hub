server {
    listen 80;
    server_name file.ntrides.com.au;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl proxy_protocol;
    listen [::]:443 ssl;
    listen 10.0.0.5:443 ssl;
    server_name file.ntrides.com.au;

    ssl_certificate     /certs/ntrides.com.au_ssl_certificate.cer;
    ssl_certificate_key /certs/_.ntrides.com.au_private_key.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    real_ip_header proxy_protocol;
    set_real_ip_from 127.0.0.0/8;

    client_max_body_size 0;

    # API → FastAPI backend
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # streaming support
        proxy_buffering    off;
        proxy_http_version 1.1;
    }

    # React SPA — serve static, fallback to index.html
    location / {
        root  /var/www/files_hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
