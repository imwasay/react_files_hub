server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;

    # API — token validated by FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;

        # range request passthrough for video seeking
        proxy_set_header   Range $http_range;
        proxy_set_header   If-Range $http_if_range;
    }

    # internal file byte endpoint — restrict to mesh network
    location /internal/ {
        # Add your mesh/VPN subnets here
        # allow 10.214.83.0/24;
        # allow 10.72.0.0/24;
        # deny  all;

        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }

    # health — public, no auth
    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
    }

    # React SPA fallback (if serving frontend from this node)
    location / {
        root  /var/www/files_hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
