server {
    listen 80;
    server_name ~^(.+)\.ntrides\.com\.au$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(.+)\.ntrides\.com\.au$;

    ssl_certificate     /etc/letsencrypt/live/ntrides.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntrides.com.au/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;

    # direct file serving — token validated by FastAPI
    location /serve/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;

        # range request passthrough for video seeking
        proxy_set_header   Range $http_range;
        proxy_set_header   If-Range $http_if_range;
    }

    # internal file byte endpoint — Internal network only, not public
    location /internal/ {
        allow 10.214.83.0/24;
        allow 10.72.0.0/24;
        deny  all;

        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }

    # health — public, no auth needed
    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
    }

    # block everything else
    location / {
        return 403;
    }
}
