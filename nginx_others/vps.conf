upstream dir_node {
    server 10.72.0.1:8000;  # directory node via internal network
}

server {
    listen 80;
    server_name ntrides.com.au;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ntrides.com.au;

    ssl_certificate     /etc/letsencrypt/live/ntrides.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntrides.com.au/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;

    # health answered locally by ntrides-edge service — never proxied
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8080;
    }

    # all other API calls — proxy to directory node
    location /api/ {
        proxy_pass         http://dir_node;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;

        # if dir node unreachable, fall through to edge cache
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 = @dir_offline;
    }

    # fallback — serve cached registry data when dir node is down
    location @dir_offline {
        proxy_pass http://127.0.0.1:8080;
    }

    # React SPA
    location / {
        root  /var/www/ntrides;
        index index.html;
        try_files $uri $uri/ /index.html;

        # aggressive caching for static assets
        location ~* \.(js|css|woff2|png|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
